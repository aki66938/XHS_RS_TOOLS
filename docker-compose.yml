services:
  xhs-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    ports:
      - "127.0.0.1:8765:8765"
    shm_size: 2gb
    restart: unless-stopped
    environment:
      XHS_BROWSER_PROXY: ${XHS_BROWSER_PROXY:-}
    volumes:
      - ./.local:/app/.local
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
